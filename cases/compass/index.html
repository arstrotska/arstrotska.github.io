    <script>
      (() => {
        // Keep the desktop layout scale stable across browser chrome, display
        // scaling, window modes and navigation. Only the viewport affects it.
        const updateLayoutScale = () => {
          const viewport = window.innerWidth;
          const scale = viewport >= 390 && viewport <= 480
            ? viewport / 390
            : 1 - 0.2 * Math.max(0, Math.min(1, (viewport - 900) / 300));

          document.documentElement.style.setProperty('--portfolio-scale', scale.toFixed(4));
        };

        updateLayoutScale();
        document.addEventListener('DOMContentLoaded', updateLayoutScale, { once: true });
        window.addEventListener('load', updateLayoutScale, { once: true });
        window.addEventListener('resize', updateLayoutScale, { passive: true });
      })();
    </script>
